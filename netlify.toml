# Netlify 배포 설정 — 저장소(Comely15/build_up)를 연결하고 Base directory 는 비워 둔다.
# Netlify 가 npm install → 아래 명령으로 빌드·검증 → dist/ 를 게시한다. 검증이 실패하면 배포도 실패한다.
[build]
  command = "npm run build && node scripts/verify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
