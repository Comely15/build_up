# Netlify 배포 설정 — 이 파일은 사이트 폴더(buildup365/) 안에 있고, Netlify 의 Base directory 를 `buildup365` 로 잡는다.
# 그러면 Netlify 가 이 폴더에서 npm install → 아래 명령으로 빌드·검증 → dist/ 를 게시한다.
# buildup365/ 바깥만 바뀐 커밋은 배포하지 않는다.
[build]
  command = "npm run build && node scripts/verify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
